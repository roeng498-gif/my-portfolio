<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ app_name }} - {{ t('verify.title') }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 420px; background: #16102e; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 32px 28px; }
        .auth-logo { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 14px; background: #6C5CE7; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; }
        .auth-card h1 { text-align: center; font-size: 22px; margin-bottom: 6px; }
        .auth-card p.sub { text-align: center; color: #a29db5; font-size: 14px; margin-bottom: 22px; line-height: 1.7; }
        .auth-card input[type=text] { width: 100%; box-sizing: border-box; padding: 14px; margin-bottom: 14px; background: #20173e; border: 1px solid rgba(255,255,255,.1); color: #fff; border-radius: 10px; font-family: inherit; font-size: 22px; letter-spacing: 8px; text-align: center; }
        .auth-btn { width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: #6C5CE7; color: #fff; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; }
        .auth-btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,.25); margin-bottom: 18px; }
        .msg { padding: 10px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; }
        .msg.err { background: rgba(217,83,79,.15); border: 1px solid rgba(217,83,79,.5); color: #f87171; }
        .msg.ok { background: rgba(76,175,80,.15); border: 1px solid rgba(76,175,80,.5); color: #4CAF50; }
        .links { text-align: center; margin-top: 16px; font-size: 14px; }
        .links a { color: #C4B5FD; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo"><i class="fa-solid fa-message"></i></div>
            <h1>{{ t('verify.title') }}</h1>
            <p class="sub">{{ t('verify.subtitle', phone=masked) }}</p>

            {% if error %}<div class="msg err" role="alert">{{ error }}</div>{% endif %}
            {% if msg %}<div class="msg ok" role="status">{{ msg }}</div>{% endif %}

            <form method="POST">
                <input type="hidden" name="action" value="send">
                <button type="submit" class="auth-btn ghost">{{ t('verify.send') }}</button>
            </form>

            <form method="POST" autocomplete="off">
                <input type="hidden" name="action" value="verify">
                <input type="text" name="code" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code" dir="ltr" required>
                <button type="submit" class="auth-btn">{{ t('verify.btn') }}</button>
            </form>

            <p class="links">
                <a href="{{ url_for('profile') }}">{{ t('verify.change_phone') }}</a>
                <a href="{{ url_for('logout') }}">{{ t('nav.logout') }}</a>
            </p>
        </div>
    </div>
</body>
</html>
